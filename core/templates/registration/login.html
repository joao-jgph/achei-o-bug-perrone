{% extends 'main.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width:420px; margin:48px auto;">
  <div class="card p-4">
    <h3 class="mb-3">Entrar</h3>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-danger">Por favor corrija os erros abaixo.</div>
      {% endif %}

      <div class="mb-3">
        <label for="id_username" class="form-label">Usuário</label>
        <input type="text" name="username" autofocus required id="id_username" class="form-control">
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Senha</label>
        <input type="password" name="password" required id="id_password" class="form-control">
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <button type="submit" class="btn btn-primary">Entrar</button>
        <a href="{% url 'pessoas:cadastro_interno' %}" class="btn btn-link">Criar conta</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
