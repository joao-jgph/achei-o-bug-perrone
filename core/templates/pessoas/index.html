<html xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body>{% extends 'main.html' %}
{%load static %}

{% block content %} 


<div id="principal">

    <div class="pt-md-5 pt-4">

        <div class="container pt-md-5">
            <div class="row pt-md-5">
                <div class="col-md-6 col-sm-12 pt-md-5">
                    <div class="d-flex justify-content-center align-items-center">
                        <hr class="linha-principal">
                        <h2 class="text-uppercase">Acessar Sistema</h2>
                        <hr class="linha-principal">
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-md-6 col-sm-12 d-flex flex-row">               
                    <img class="img-fluid" src="{% static 'img/icon.ico' %}" alt="Logo Eventos Salvador">
                                    
                    <form action="file:///P:/GEDIS/Treinamentos/Django/Aula%204/arquivos/index.html#" method="POST" class="ml-3">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="login">LOGIN</label>
                            <input name="login" type="text" class="form-control login" id="login" aria-describedby="loginHelp" placeholder="Login">
                        </div>
                        <div class="form-group">
                            <label for="senha">SENHA</label>
                            <input name="senha" type="password" class="form-control" id="senha" placeholder="Senha">
                        </div>
                        
                        <button type="submit" class="btn-block w-100">ENTRAR</button>                    
                    </form>    
                </div>
            </div>
        </div>


        <div class="container mt-2">
            <div class="row">
                <div class="col-12 align-self-start">
                    <p>Não tem cadastro? <a href="{% url 'pessoas:cadastro_interno' %}">clique aqui</a></p>
                </div>
            </div>
        </div>

    <div class="container">
            <div class="row">
                <div class="col-6">
                    <div class="row justify-content-center">
                        <div class="col-6 align-self-center">
                            {% include 'partials/_mensagem.html' %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>


{% endblock %}
