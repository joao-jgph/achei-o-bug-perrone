{% extends 'main.html' %}
{% load static %}
{% load crispy_forms_tags %}


{% block content %}

<div class="container">

	<div class="row">
		<div class="col-12">
			<a href="{% url 'pessoas:index' %}" class="btn btn-outline-secondary mt-3" role="button">Voltar</a>
		</div>
	</div>

	<div class="row">
		<div class="col-12 text-center mt-4">
			<h1>Atualizar Cadastro - Usuário Interno</h1>
		</div>
	</div>

	<div class="row mt-3">
		<div class="col-12">
			{% include 'partials/_mensagem.html' %}
		</div>
	</div>

	<div class="row" style="margin-bottom: 2%">
		<div class="col-12 mb-2">
			<form action="" method="POST" enctype="multipart/form-data">
				{% csrf_token %}

				{% crispy form %}

				<div class="d-grid gap-2 d-md-flex justify-content-md-end">
					<button type="submit" class="btn btn-primary">Salvar alterações</button>
				</div>
			</form>
		</div>
	</div>

</div>

{% endblock content %}
